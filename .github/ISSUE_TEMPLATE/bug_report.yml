name: Bug report
description: Report a reproducible problem in CCue
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities or include private audio or transcripts here. Use the private security advisory link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: CCue version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.0 on MacBook Pro (Apple M-series)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include clear reproduction steps and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove captions, transcripts, credentials, and other personal data before pasting logs.
      render: shell
