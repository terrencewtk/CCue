<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>CCue</title>
    <link rel="stylesheet" href="design-system.css" />
    <link rel="stylesheet" href="control.css" />
  </head>
  <body>
    <main class="control-shell">
      <div class="titlebar-drag-region" aria-hidden="true"></div>
      <header class="panel-header">
        <div class="app-brand">
          <img class="app-icon" src="../assets/ccue-icon-master.png" alt="" />
          <h1>CCue</h1>
        </div>
        <button id="settingsButton" class="settings-button" type="button" aria-label="Open settings" title="Settings (⌘,)">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 15.25a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5Z" />
            <path d="M19.2 13.25a7.8 7.8 0 0 0 .05-1.25 7.8 7.8 0 0 0-.05-1.25l1.63-1.27-1.75-3.03-1.92.78a7.68 7.68 0 0 0-2.16-1.25l-.29-2.03h-3.5l-.29 2.03a7.68 7.68 0 0 0-2.16 1.25l-1.92-.78-1.75 3.03 1.63 1.27A7.8 7.8 0 0 0 6.67 12c0 .42.02.84.05 1.25l-1.63 1.27 1.75 3.03 1.92-.78a7.68 7.68 0 0 0 2.16 1.25l.29 2.03h3.5l.29-2.03a7.68 7.68 0 0 0 2.16-1.25l1.92.78 1.75-3.03-1.63-1.27Z" />
          </svg>
        </button>
      </header>

      <section aria-labelledby="sessionHeading">
        <h2 id="sessionHeading">Caption session</h2>
        <div class="settings-group">
          <label class="setting-row" for="sessionLanguage">
            <span class="setting-copy">
              <strong>Spoken language</strong>
            </span>
            <select id="sessionLanguage" name="sessionLanguage">
              <option value="" disabled selected>Checking downloaded models…</option>
            </select>
          </label>
          <label class="setting-row" for="sessionTranslationEnabled">
            <span class="setting-copy">
              <strong>Translate captions</strong>
            </span>
            <span class="switch">
              <input id="sessionTranslationEnabled" name="sessionTranslationEnabled" type="checkbox" />
              <span class="switch-track"></span>
            </span>
          </label>
          <label class="setting-row" for="sessionTranslationLanguage">
            <span class="setting-copy">
              <strong>Translation language</strong>
            </span>
            <select id="sessionTranslationLanguage" name="sessionTranslationLanguage">
              <option value="" disabled selected>Checking downloaded models…</option>
            </select>
          </label>
        </div>
      </section>

      <section class="capture-section" aria-label="Capture controls">
        <div class="capture-actions">
          <button id="captureButton" class="primary" type="button" disabled>Start captions</button>
          <span id="statusMessage" class="visually-hidden" role="status" aria-live="polite">Ready. Waiting to start</span>
        </div>
      </section>
    </main>
    <script src="model-availability.js"></script>
    <script src="control.js"></script>
  </body>
</html>
